name: Build APK Automatico

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar e Organizar Estrutura
        run: |
          unzip -o *.zip
          
          # Procura a pasta exata onde os arquivos do projeto Gradle foram extraidos
          GRADLE_FILE=$(find . -mindepth 2 -name "build.gradle*" -o -name "settings.gradle*" | head -n 1)
          
          if [ -n "$GRADLE_FILE" ]; then
            TARGET_DIR=$(dirname "$GRADLE_FILE")
            echo "Projeto encontrado em: $TARGET_DIR"
            echo "Mesclando arquivos na raiz do repositorio..."
            cp -r "$TARGET_DIR"/. .
            rm -rf "$TARGET_DIR"
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VotoAoVivo-APK
          path: "**/*.apk"
