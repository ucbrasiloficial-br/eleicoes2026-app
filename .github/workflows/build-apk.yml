name: Build APK Automatico

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar e Organizar Estrutura
        run: |
          unzip -o *.zip
          
          # Localiza a pasta onde os arquivos do projeto Gradle foram extraidos
          GRADLE_FILE=$(find . -mindepth 2 -name "build.gradle*" -o -name "settings.gradle*" | head -n 1)
          
          if [ -n "$GRADLE_FILE" ]; then
            TARGET_DIR=$(dirname "$GRADLE_FILE")
            echo "Projeto encontrado em: $TARGET_DIR"
            echo "Organizando arquivos na raiz..."
            cp -rf "$TARGET_DIR"/. .
            rm -rf "$TARGET_DIR"
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Configurar Ambiente Android e AndroidX
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Ativa o AndroidX e Jetifier no gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VotoAoVivo-APK
          path: "**/*.apk"
          
