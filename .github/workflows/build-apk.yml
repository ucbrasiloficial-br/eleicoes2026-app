name: Build APK com Dados Reais 2026

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar e Organizar Estrutura
        run: |
          unzip -o *.zip || true
          
          GRADLE_FILE=$(find . -mindepth 2 -name "build.gradle*" -o -name "settings.gradle*" | head -n 1)
          
          if [ -n "$GRADLE_FILE" ]; then
            TARGET_DIR=$(dirname "$GRADLE_FILE")
            echo "Projeto encontrado em: $TARGET_DIR"
            cp -rf "$TARGET_DIR"/. .
            rm -rf "$TARGET_DIR"
          fi

      - name: Injetar Dados Reais de 2026 e Interface Profissional
        run: |
          python3 -c '
          import os, glob

          # Injeta Theme.kt profissional
          theme_code = """package com.eleicoes2026.votoaovivo.presentation.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val DarkColorScheme = darkColorScheme(
              primary = Color(0xFF0055FF),
              secondary = Color(0xFF00C853),
              background = Color(0xFF070F1E),
              surface = Color(0xFF0F1E36),
              onPrimary = Color.White,
              onSecondary = Color.White,
              onBackground = Color(0xFFF1F5F9),
              onSurface = Color(0xFFF1F5F9)
          )

          @Composable
          fun VotoAoVivoTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = DarkColorScheme,
                  content = content
              )
          }
          """
          for f in glob.glob("**/Theme.kt", recursive=True):
              with open(f, "w", encoding="utf-8") as file:
                  file.write(theme_code)

          # Injeta HomeScreen.kt com os dados reais de 2026
          home_code = """package com.eleicoes2026.votoaovivo.presentation.screens

          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          @Composable
          fun HomeScreen(onCandidateClick: (Any?) -> Unit = {}) {
              var selectedTurno by remember { mutableStateOf("1º Turno") }

              val candidatos1Turno = listOf(
                  mapOf("nome" to "Flávio Nantes Bolsonaro", "partido" to "PL • Nº 22", "votos" to "56.104.503", "porcentagem" to "47,03%", "status" to "2º Turno", "cor" to Color(0xFF065F46)),
                  mapOf("nome" to "Luiz Inácio Lula da Silva", "partido" to "PT • Nº 13", "votos" to "53.879.538", "porcentagem" to "45,16%", "status" to "2º Turno", "cor" to Color(0xFF1D4ED8)),
                  mapOf("nome" to "Augusto Jorge Cury", "partido" to "AVANTE • Nº 20", "votos" to "3.448.569", "porcentagem" to "2,89%", "status" to "Não Eleito", "cor" to Color(0xFF334155)),
                  mapOf("nome" to "Renan Ferreira dos Santos", "partido" to "MISSÃO • Nº 29", "votos" to "2.675.887", "porcentagem" to "2,24%", "status" to "Não Eleito", "cor" to Color(0xFF334155)),
                  mapOf("nome" to "Ronaldo Ramos Caiado", "partido" to "PSD • Nº 55", "votos" to "2.605.148", "porcentagem" to "2,18%", "status" to "Não Eleito", "cor" to Color(0xFF334155)),
                  mapOf("nome" to "Romeu Zema Neto", "partido" to "NOVO • Nº 30", "votos" to "326.488", "porcentagem" to "0,27%", "status" to "Não Eleito", "cor" to Color(0xFF334155))
              )

              val candidatos2Turno = listOf(
                  mapOf("nome" to "Flávio Nantes Bolsonaro", "partido" to "PL • Nº 22", "votos" to "Aguardando Votação", "porcentagem" to "—", "status" to "2º Turno", "cor" to Color(0xFF065F46)),
                  mapOf("nome" to "Luiz Inácio Lula da Silva", "partido" to "PT • Nº 13", "votos" to "Aguardando Votação", "porcentagem" to "—", "status" to "2º Turno", "cor" to Color(0xFF1D4ED8))
              )

              val listaCandidatos = if (selectedTurno == "1º Turno") candidatos1Turno else candidatos2Turno

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF070F1E))
                      .padding(16.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column {
                          Text("ELEIÇÕES GERAIS 2026", color = Color(0xFF38BDF8), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          Text("Apuração Oficial - Brasil", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      }
                      Surface(
                          color = Color(0xFFEF4444).copy(alpha = 0.2f),
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Row(modifier = Modifier.padding(horizontal = 10.dp, vertical = 6.dp), verticalAlignment = Alignment.CenterVertically) {
                              Box(modifier = Modifier.size(8.dp).clip(CircleShape).background(Color(0xFFEF4444)))
                              Spacer(modifier = Modifier.width(6.dp))
                              Text("AO VIVO", color = Color(0xFFEF4444), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      listOf("1º Turno", "2º Turno").forEach { turno ->
                          val isSelected = selectedTurno == turno
                          Button(
                              onClick = { selectedTurno = turno },
                              modifier = Modifier.weight(1f),
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = if (isSelected) Color(0xFF0055FF) else Color(0xFF0F1E36)
                              ),
                              shape = RoundedCornerShape(10.dp)
                          ) {
                              Text(turno, color = Color.White, fontWeight = FontWeight.Bold)
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF0F1E36)),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              Text("Urnas Apuradas", color = Color.Gray, fontSize = 13.sp)
                              Text(if (selectedTurno == "1º Turno") "100,00%" else "0,00%", color = Color.Green, fontWeight = FontWeight.Bold)
                          }
                          Spacer(modifier = Modifier.height(8.dp))
                          LinearProgressIndicator(
                              progress = if (selectedTurno == "1º Turno") 1f else 0f,
                              modifier = Modifier.fillMaxWidth().height(8.dp).clip(RoundedCornerShape(4.dp)),
                              color = Color(0xFF0055FF),
                              trackColor = Color(0xFF1E293B)
                          )
                      }
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  Text("Presidente da República", color = Color(0xFF94A3B8), fontSize = 14.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(8.dp))

                  LazyColumn(
                      verticalArrangement = Arrangement.spacedBy(10.dp),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      items(listaCandidatos) { cand ->
                          Card(
                              modifier = Modifier.fillMaxWidth(),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFF0F1E36)),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Row(
                                  modifier = Modifier.padding(16.dp).fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Box(
                                      modifier = Modifier
                                          .size(48.dp)
                                          .clip(CircleShape)
                                          .background(cand["cor"] as Color),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Text(cand["nome"].toString().take(1), color = Color.White, fontWeight = FontWeight.Bold, fontSize = 20.sp)
                                  }
                                  Spacer(modifier = Modifier.width(16.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(cand["nome"].toString(), color = Color.White, fontWeight = FontWeight.Bold, fontSize = 15.sp)
                                      Text(cand["partido"].toString(), color = Color(0xFF38BDF8), fontSize = 12.sp)
                                      Spacer(modifier = Modifier.height(4.dp))
                                      Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                                          Text("${cand["votos"]} votos", color = Color.Gray, fontSize = 12.sp)
                                          Text(cand["porcentagem"].toString(), color = Color.White, fontWeight = FontWeight.Bold, fontSize = 13.sp)
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          """
          for f in glob.glob("**/HomeScreen.kt", recursive=True):
              with open(f, "w", encoding="utf-8") as file:
                  file.write(home_code)
          '

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Configurar Memoria e Ambiente Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VotoAoVivo-APK
          path: "**/*.apk"
          
