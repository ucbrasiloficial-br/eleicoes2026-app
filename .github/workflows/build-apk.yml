name: Build APK Automatico

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar e Organizar Estrutura
        run: |
          unzip -o *.zip || true
          
          # Localiza a pasta onde os arquivos do projeto Gradle foram extraidos
          GRADLE_FILE=$(find . -mindepth 2 -name "build.gradle*" -o -name "settings.gradle*" | head -n 1)
          
          if [ -n "$GRADLE_FILE" ]; then
            TARGET_DIR=$(dirname "$GRADLE_FILE")
            echo "Projeto encontrado em: $TARGET_DIR"
            echo "Organizando arquivos na raiz..."
            cp -rf "$TARGET_DIR"/. .
            rm -rf "$TARGET_DIR"
          fi

      - name: Corrigir erros de sintaxe no codigo Kotlin (Auto-Fix)
        run: |
          python3 -c '
          import glob, re

          files = glob.glob("**/FavoritesScreen.kt", recursive=True)
          for fpath in files:
              print(f"Corrigindo sintaxe em: {fpath}")
              with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                  lines = f.readlines()
              
              new_lines = []
              for i, line in enumerate(lines):
                  # Corrige aspas internas mal formatadas nas linhas 25 a 40
                  if 25 <= i <= 40:
                      line = re.sub(r"\"([^\"]*)\"([^\"]*)\"([^\"]*)\"", r"\"\1 \2 \3\"", line)
                      if "text =" in line:
                          line = re.sub(r"text\s*=\s*\".*?\"", "text = \"Favoritos\"", line)
                  new_lines.append(line)
              
              with open(fpath, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
          '

      - name: Corrigir recursos ausentes (Modo de Seguranca)
        run: |
          find . -type f -name "AndroidManifest.xml" -exec sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' {} +
          find . -type f -name "AndroidManifest.xml" -exec sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' {} +
          find . -type f -name "AndroidManifest.xml" -exec sed -i 's/@style\/Theme.VotoAoVivo/@android:style\/Theme.DeviceDefault.Light.NoActionBar/g' {} +

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Configurar Memoria e Ambiente Android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Ativa o AndroidX e expande a memoria RAM para 4GB
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VotoAoVivo-APK
          path: "**/*.apk"
          
